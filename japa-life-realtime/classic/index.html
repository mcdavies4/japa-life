<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japa Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#E6EBF2; --sky2:#D5DDEA; --ink:#1C1B3A; --card:#FFFFFF; --muted:#5B5F7A;
  --green:#0E7A4B; --yellow:#F4C430; --pink:#E5487A; --indigo:#2D3192;
  --line:#CDD4E0; --good:#0E7A4B; --bad:#C2304F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#14142A; --sky2:#2A2A4C; --ink:#F1F2F8; --card:#20203D; --muted:#A3A7C2; --line:#34345A;
    --good:#3DCB8A; --bad:#FF6F8E;
  }
}
:root[data-theme="dark"]{
  --sky:#14142A; --sky2:#2A2A4C; --ink:#F1F2F8; --card:#20203D; --muted:#A3A7C2; --line:#34345A;
  --good:#3DCB8A; --bad:#FF6F8E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:14px 14px 32px}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;letter-spacing:-.02em}
h2{font-size:28px;line-height:1.1;margin:0 0 6px}
h3{font-size:20px;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:15px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--card);border-radius:16px;border:1.5px solid var(--line);overflow:hidden;margin-bottom:12px}
.pad{padding:18px 18px 20px}
.ankara{height:40px;display:block;width:100%}
.btn{display:block;width:100%;padding:15px 18px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:18px;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-top:10px}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}

/* title */
.title{font-size:58px;line-height:.9;font-weight:800;letter-spacing:-.04em;margin:4px 0 12px}
.hero{margin-top:5vh}

/* pickers */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.opt{border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 12px;font-weight:600;font-size:15px}
.opt.on{border-color:var(--ink);background:var(--yellow);color:#1C1B3A}
.swatch{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid transparent}
.swatch.on{border-color:var(--ink);background:none}
.label{font-weight:700;font-size:15px;margin-bottom:2px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 16px}
.pick{display:block;width:100%;text-align:left;border:2px solid var(--line);background:transparent;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pick.on{border-color:var(--ink);background:var(--yellow);color:#1C1B3A}
.pick b{display:block;font-size:17px}
.pick span{font-size:14px;opacity:.8}
.avatar-big{display:flex;justify-content:center;margin:4px 0 14px}

/* hud */
.hud{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hud svg{border-radius:50%;flex:none}
.who b{display:block;font-size:18px;line-height:1.2}
.who span{font-size:14px;color:var(--muted)}
.money{margin-left:auto;text-align:right}
.money b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.money span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.bar-k{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s ease}
.dream{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.dream .em{font-size:24px}
.dream .bar{margin-top:4px}
.dream .t{font-size:14px;font-weight:600;display:flex;justify-content:space-between}

.when{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 8px}
.when .day{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em}
.week{display:flex;gap:4px;margin:0 2px 12px}
.week span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.week span.done{background:var(--green)} .week span.now{background:var(--yellow)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{text-align:left;border:2px solid var(--ink);background:transparent;border-radius:14px;padding:12px;min-height:92px;display:flex;flex-direction:column}
.act .e{font-size:24px;line-height:1}
.act b{font-size:16px;margin-top:6px;line-height:1.2}
.act span{font-size:13px;color:var(--muted);margin-top:auto;padding-top:4px}
@media (hover:hover){.act:not(:disabled):hover,.choice:hover{background:var(--yellow);color:#1C1B3A}.act:not(:disabled):hover span{color:#1C1B3A}}

.today{font-size:15px;padding:10px 14px;border-radius:12px;background:var(--sky2);margin-bottom:12px}
.emoji{font-size:36px;line-height:1;margin-bottom:8px}
.prompt{font-size:20px;line-height:1.35;font-weight:600;margin:0 0 16px}
.choices{display:grid;gap:10px}
.choice{text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:600;font-size:17px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}

.ledger{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;margin-bottom:14px}
.ledger .tot{font-weight:700;border-top:1.5px solid var(--line);padding-top:4px}
.mum{background:var(--sky2);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.saves{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.saves button{border:2px solid var(--green);background:transparent;border-radius:10px;padding:10px 4px;font-weight:700;color:var(--green);font-size:15px}
.house{font-size:44px;text-align:center;margin:6px 0}

.lottery{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;line-height:1.05;text-align:center;margin:18px 0 6px;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.lottery-e{font-size:64px;text-align:center;line-height:1}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:2px solid var(--ink);background:transparent;border-radius:10px;padding:8px;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--sky)}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font-weight:800;color:var(--muted)}
.rank .nm{font-weight:700;line-height:1.2}
.rank .nm span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.rank .sc{font-weight:800;font-variant-numeric:tabular-nums}
.rank.me{background:var(--sky2);border-radius:10px;padding-left:6px;padding-right:6px}
.area-bar{margin-bottom:10px}
.area-bar .bar{height:12px}

.topnav{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.ghost{border:0;background:transparent;font-weight:700;font-size:15px;padding:6px 8px;border-radius:8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--sky);padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:5}
.toast.show{opacity:1}
.fade{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- state ---------- */
const KEY="japa_life_v2";
let S=null, draft=null, view=null, rankTab="players";
const app=document.getElementById("app");

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function has(t){return S.traits.includes(t)}
function lvl(){let l=1;for(let i=1;i<XP.length;i++) if(S.xp>=XP[i]) l=i+1;return l}
function R(){return ROUTES[S.route]}
function cap(){return S.route==="student"&&S.graduated?7:R().cap}
function title(){return R().titles[lvl()-1]}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600)}
function gbp(n){return (n<0?"−£":"£")+Math.abs(Math.round(n)).toLocaleString("en-GB")}

function avatar(look,size){
  const skin=SKINS[look.skin], fit=`url(#fit${look.fit})`, hc="#17110C";
  let back="",front="";
  if(look.hair===0) front=`<path d="M21 26Q21 15 32 15Q43 15 43 26Q40 19 32 19Q24 19 21 26Z" fill="${hc}"/>`;
  if(look.hair===1) back=`<circle cx="32" cy="23" r="16" fill="${hc}"/>`;
  if(look.hair===2) back=`<path d="M19 26Q19 11 32 11Q45 11 45 26L46 46L42 46L41 28L23 28L22 46L18 46Z" fill="${hc}"/>`;
  if(look.hair===3) front=`<path d="M16 25Q17 8 32 8Q48 8 49 23Q42 17 32 18Q22 17 16 25Z" fill="${fit}" stroke="#1C1B3A" stroke-width="1"/>`;
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><rect width="64" height="64" fill="var(--sky2)"/>${back}<path d="M8 66Q10 45 32 43Q54 45 56 66Z" fill="${fit}"/><rect x="28" y="35" width="8" height="9" fill="${skin}"/><circle cx="32" cy="27" r="11" fill="${skin}"/>${front}</svg>`;
}

/* ---------- dream ---------- */
function progress(){
  const D=DREAMS[S.dream];
  if(S.dream==="oga"){ if(lvl()>=6) return 1; return Math.min(.99,S.xp/XP[5]); }
  if(S.dream==="mum"){ const a=Math.min(1,S.fund/D.target), b=Math.min(1,S.f/80); return (a>=1&&b>=1)?1:Math.min(.99,a*.7+b*.3); }
  return Math.min(1,S.fund/D.target);
}
function houseStage(p){return p>=1?["🏡","Finished. Housewarming in December."]:p>=.7?["🏠","Roofing. The village is talking."]:p>=.4?["🏗️","Walls going up."]:p>=.2?["🧱","Foundation laid."]:["🟫","You own the land. That’s a start."]}
function score(){return (S.dreamsDone||0)*100+Math.round(progress()*100)}
function checkDream(){ if(progress()>=1 && view!=="dream"){ view="dream"; render(); return true } return false }

/* ---------- daily streak ---------- */
function claimDaily(){
  const t=today(); if(S.lastDay===t) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  S.streak = S.lastDay===ys ? (S.streak||0)+1 : 1;
  S.lastDay=t;
  const bonus=20*Math.min(S.streak,7);
  S.m+=bonus; save();
  setTimeout(()=>toast(`Day ${S.streak} streak. Mum’s blessing: +£${bonus}`),300);
}

/* ---------- rankings (optional shared db) ---------- */
let dbP=null, idP=null;
function getDb(){ if(!dbP) dbP=(window.claude&&window.claude.use)?window.claude.use("db").catch(()=>null):Promise.resolve(null); return dbP }
function getId(){ if(!idP) idP=(window.claude&&window.claude.use)?window.claude.use("user").then(u=>u?u.id():null).catch(()=>null):Promise.resolve(null); return idP }
async function syncRank(){
  try{ const db=await getDb(), id=await getId(); if(!db||!id) return;
    await db.collection("players").doc(id).set({name:S.name.slice(0,16),area:S.area,route:S.route,dream:S.dream,
      progress:Math.round(progress()*100),dreams:S.dreamsDone||0,score:score(),week:S.week,level:lvl(),updatedAt:Date.now()});
  }catch(e){}
}

/* ---------- rendering ---------- */
function render(){
  if(view==="ranks") return renderRanks();
  if(view==="dream") return renderDream();
  if(!S) return renderTitle();
  if(S.phase==="action") return renderAction();
  if(S.phase==="event") return renderEvent();
  if(S.phase==="eventResult") return renderEventResult();
  if(S.phase==="sunday") return renderSunday();
}

function renderTitle(){
  const saved=load();
  app.innerHTML=`<section class="hero fade"><div class="card">${BAND}<div class="pad">
    <h1 class="title">Japa Life</h1>
    <p class="muted">Build a life in London. Chase your dream. Keep Mum happy. Five minutes a day.</p>
    ${saved?`<button class="btn" id="cont">Continue as ${esc(saved.name)}</button><button class="btn alt" id="new">Start a new life</button>`:`<button class="btn" id="new">Start your japa</button>`}
  </div></div></section>`;
  if(saved) document.getElementById("cont").onclick=()=>{S=saved;claimDaily();if(!checkDream())render()};
  document.getElementById("new").onclick=()=>{
    if(saved && !confirm("Start over? Your current life will be replaced.")) return;
    draft={name:"",look:{skin:1,hair:0,fit:0},traits:[],dream:null,step:1}; renderCreate();
  };
}

function renderCreate(){
  const d=draft;
  if(d.step===1){
    app.innerHTML=`<section class="card fade">${BAND}<div class="pad">
      <h2>Who are you?</h2><p class="muted small">Step 1 of 3</p>
      <div class="avatar-big">${avatar(d.look,112)}</div>

      <div class="label">Hair</div>
      <div class="opts">${HAIRS.map((h,i)=>`<button class="opt ${d.look.hair===i?"on":""}" data-hair="${i}">${h}</button>`).join("")}</div>
      <div class="label">Outfit fabric</div>
      <div class="opts">${[0,1,2,3].map(i=>`<button class="swatch ${d.look.fit===i?"on":""}" data-fit="${i}" aria-label="Fabric ${i+1}"><svg width="36" height="36" style="border-radius:50%"><rect width="36" height="36" fill="url(#fit${i})"/></svg></button>`).join("")}</div>
      <button class="btn" id="next">Next</button>
    </div></section>`;
    const nm=document.getElementById("nm"); nm.oninput=()=>d.name=nm.value;
    app.querySelectorAll("[data-skin]").forEach(b=>b.onclick=()=>{d.look.skin=+b.dataset.skin;renderCreate()});
    app.querySelectorAll("[data-hair]").forEach(b=>b.onclick=()=>{d.look.hair=+b.dataset.hair;renderCreate()});
    app.querySelectorAll("[data-fit]").forEach(b=>b.onclick=()=>{d.look.fit=+b.dataset.fit;renderCreate()});
    document.getElementById("next").onclick=()=>{ d.name=nm.value.trim(); if(!d.name){toast("Pick a nickname first.");nm.focus();return} d.step=2; renderCreate(); };
  } else if(d.step===2){
    app.innerHTML=`<section class="card fade">${BAND}<div class="pad">
      <h2>Pick two traits</h2><p class="muted small">Step 2 of 3</p>
      ${TRAITS.map(t=>`<button class="pick ${d.traits.includes(t.id)?"on":""}" data-t="${t.id}"><b>${t.n}</b><span>${t.d}</span></button>`).join("")}
      <button class="btn" id="next" ${d.traits.length!==2?"disabled":""}>Next</button>
      <button class="btn alt" id="back">Back</button>
    </div></section>`;
    app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const id=b.dataset.t;
      if(d.traits.includes(id)) d.traits=d.traits.filter(x=>x!==id); else if(d.traits.length<2) d.traits.push(id); else {d.traits.shift();d.traits.push(id)}
      renderCreate()});
    document.getElementById("next").onclick=()=>{d.step=3;renderCreate()};
    document.getElementById("back").onclick=()=>{d.step=1;renderCreate()};
  } else if(d.step===3){
    app.innerHTML=`<section class="card fade">${BAND}<div class="pad">
      <h2>What’s your japa dream?</h2><p class="muted small">Step 3 of 3</p>
      ${Object.entries(DREAMS).map(([k,v])=>`<button class="pick ${d.dream===k?"on":""}" data-d="${k}"><b>${v.em} ${v.name}</b><span>${v.d}</span></button>`).join("")}
      <button class="btn" id="next" ${!d.dream?"disabled":""}>Take the japa lottery</button>
      <button class="btn alt" id="back">Back</button>
    </div></section>`;
    app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{d.dream=b.dataset.d;renderCreate()});
    document.getElementById("next").onclick=renderLottery;
    document.getElementById("back").onclick=()=>{d.step=2;renderCreate()};
  }
}

function rollRoute(){const ent=Object.entries(ROUTES);let r=Math.random()*ent.reduce((a,[,v])=>a+v.w,0);for(const [k,v] of ent){r-=v.w;if(r<=0)return k}return "care"}

function renderLottery(){
  const result=rollRoute(); draft.route=result;
  app.innerHTML=`<section class="card fade">${BAND}<div class="pad">
    <h2 style="text-align:center">The japa lottery</h2>
    <p class="muted small" style="text-align:center">You don’t choose how you land in London.</p>
    <div class="lottery-e" id="le">✈️</div>
    <div class="lottery" id="lt">…</div>
    <div id="after"></div>
  </div></section>`;
  const keys=Object.keys(ROUTES), le=document.getElementById("le"), lt=document.getElementById("lt");
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let n=0; const total=reduce?0:18;
  const tick=()=>{
    if(n<total){const k=keys[n%keys.length];le.textContent=ROUTES[k].em;lt.textContent=ROUTES[k].name;n++;setTimeout(tick,60+n*8);return}
    const r=ROUTES[result]; le.textContent=r.em; lt.textContent=r.name; lt.classList.add("pop"); le.classList.add("pop");
    document.getElementById("after").innerHTML=`<p style="text-align:center">${r.blurb}</p>
      <p class="muted small" style="text-align:center">Starting cash ${gbp(r.cash)}. ${r.cap<7?`Work limit: ${r.cap} shifts a week.`:"No work limit."}</p>
      <button class="btn" id="go">Choose where you live</button>
      <button class="btn alt" id="sh">Share my result</button>`;
    document.getElementById("go").onclick=renderArea;
    document.getElementById("sh").onclick=()=>share(`I just took the japa lottery in Japa Life and got: ${r.em} ${r.name} 😭 What did you get?`);
  };
  tick();
}

function renderArea(){
  const born=draft.route==="born";
  app.innerHTML=`<section class="card fade">${BAND}<div class="pad">
    <h2>${born?"Where’s Mum’s house?":"Where do you live?"}</h2>
    <p class="muted small">${born?"Rent-free. Rules-full.":"Rent is taken every Saturday."}</p>
    ${Object.entries(AREAS).map(([k,a])=>`<button class="pick" data-a="${k}"><b>${a.name}</b><span>${a.blurb}${born?"":` Rent ${gbp(Math.round(a.rent*ROUTES[draft.route].rentMul))}/week.`}</span></button>`).join("")}
  </div></section>`;
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>startLife(b.dataset.a));
}

function startLife(area){
  const r=ROUTES[draft.route];
  S={v:2,name:draft.name,look:draft.look,traits:draft.traits,dream:draft.dream,route:draft.route,area,
     m:r.cash,e:80,j:60,f:60,xp:0,fund:0,week:1,day:0,shifts:0,wk:{earned:0,spent:0},
     phase:"action",recent:[],streak:0,lastDay:"",dreamsDone:0};
  claimDaily(); save(); syncRank(); render();
}

/* ---------- day loop ---------- */
function hud(){
  const D=DREAMS[S.dream], p=progress();
  return `<div class="topnav"><button class="ghost" id="rk">Rankings</button><button class="ghost" id="hm">Menu</button></div>
  <div class="hud">${avatar(S.look,56)}<div class="who"><b>${esc(S.name)}</b><span>${title()}, ${AREAS[S.area].name}</span></div>
    <div class="money"><b>${gbp(S.m)}</b><span>${S.streak>1?`🔥 ${S.streak}-day streak`:"in your account"}</span></div></div>
  <div class="bars">${[["e","⚡ Energy","#F4C430"],["j","😄 Joy","#E5487A"],["f","👪 Family","#0E7A4B"]].map(([k,l,c])=>`<div><div class="bar-k"><span>${l}</span><span>${S[k]}</span></div><div class="bar"><i style="width:${S[k]}%;background:${c}"></i></div></div>`).join("")}</div>
  <div class="dream"><span class="em">${S.dream==="house"?houseStage(p)[0]:D.em}</span><div class="grow"><div class="t"><span>${D.name}</span><span>${Math.floor(p*100)}%</span></div><div class="bar"><i style="width:${p*100}%;background:var(--indigo)"></i></div></div></div>
  <div class="when"><span class="day">${DAYS[S.day]}</span><span class="muted small">Week ${S.week}</span></div>
  <div class="week">${DAYS.map((_,i)=>`<span class="${i<S.day?"done":i===S.day?"now":""}"></span>`).join("")}</div>`;
}
function bindHud(){
  const rk=document.getElementById("rk"); if(rk) rk.onclick=()=>{view="ranks";render()};
  const hm=document.getElementById("hm"); if(hm) hm.onclick=()=>{S=null;render()};
}

function actionFx(id){
  const r=R(), l=lvl();
  if(id==="work"){ const wage=Math.round(r.wage*(1+.15*(l-1)));
    return {fx:{m:wage,e:-Math.round(r.workE*(has("iron")?.7:1)),j:r.workJ,x:has("techy")?2:1},
      ok:S.e>=20&&S.shifts<cap(), why:S.shifts>=cap()?"Visa limit reached":"Too tired"}}
  if(id==="hustle") return {fx:{m:[40,80].map(v=>Math.round(v*(has("hustler")?1.4:1))),e:-15},ok:S.e>=15,why:"Too tired"};
  if(id==="study") return {fx:{x:2,e:-10,j:-2},ok:S.e>=10,why:"Too tired"};
  if(id==="link") return {fx:{m:-25,j:Math.round(15*(has("owambe")?1.5:1)),e:-10},ok:S.m>=25&&S.e>=10,why:S.m<25?"Can’t afford it":"Too tired"};
  if(id==="call") return {fx:{f:has("pet")?24:12,e:-5},ok:true};
  if(id==="rest") return {fx:{e:30,j:has("foodie")?8:0},ok:true};
}
const ACTS=[["work","💼","Work a shift"],["hustle","🍛","Side hustle"],["study","📚","Learn new skills"],["link","🎉","Link up with friends"],["call","📞","Call home"],["rest","🛌","Rest"]];

function chipsFor(fx){
  return Object.entries(fx).filter(([,v])=>v!==0&&!(Array.isArray(v))).map(([k,v])=>{
    const L={m:"",j:"Joy",e:"Energy",f:"Family",x:"Career XP"}[k];
    const t=k==="m"?`${v>0?"+":"−"}£${Math.abs(v)}`:`${v>0?"+":"−"}${Math.abs(v)} ${L}`;
    return `<span class="chip ${v>0?"up":"down"}">${t}</span>`;}).join("");
}
function previewText(fx){
  return Object.entries(fx).filter(([,v])=>v!==0).map(([k,v])=>{
    if(k==="m") return Array.isArray(v)?`£${v[0]}–${v[1]}`:(v>0?`+£${v}`:`−£${-v}`);
    const L={j:"joy",e:"energy",f:"family",x:"XP"}[k]; return `${v>0?"+":"−"}${Math.abs(v)} ${L}`;}).join(", ");
}

function apply(fx){
  const before=lvl();
  for(const k in fx){ const v=fx[k];
    if(k==="m"){S.m+=v; if(v>0)S.wk.earned+=v; else S.wk.spent-=v}
    else if(k==="x"){S.xp+=v}
    else S[k]=clamp(S[k]+v);
  }
  const after=lvl(); if(after>before) setTimeout(()=>toast(`Promoted: ${R().titles[after-1]} 🎉`),200);
}

function renderAction(){
  app.innerHTML=hud()+`<section class="fade"><h3>What are you doing today?</h3><div class="actions">${ACTS.map(([id,em,n])=>{
    const a=actionFx(id); return `<button class="act" data-a="${id}" ${a.ok?"":"disabled"}><div class="e">${em}</div><b>${n}</b><span>${a.ok?previewText(a.fx):a.why}</span></button>`}).join("")}</div></section>`;
  bindHud();
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>doAction(b.dataset.a));
}

function doAction(id){
  const a=actionFx(id); const fx={...a.fx};
  if(Array.isArray(fx.m)) fx.m=Math.round(fx.m[0]+Math.random()*(fx.m[1]-fx.m[0]));
  if(id==="work") S.shifts++;
  apply(fx);
  S.today={text:pick(LINES[id]),fx};
  S.ev=pickEvent(); S.phase="event"; save();
  if(!checkDream()) render();
}

function pickEvent(){
  const wkend=S.day>=5;
  let pool=EVENTS.map((ev,i)=>({ev,i})).filter(({ev,i})=>
    (!ev.wk||wkend)&&(!ev.area||ev.area===S.area)&&(!ev.route||ev.route===S.route)&&!S.recent.includes(i));
  if(!pool.length) pool=EVENTS.map((ev,i)=>({ev,i})).filter(({ev})=>!ev.area&&!ev.route&&!ev.wk);
  const weighted=[]; pool.forEach(p=>{const w=(p.ev.area||p.ev.route)?3:1;for(let k=0;k<w;k++)weighted.push(p.i)});
  const i=pick(weighted); S.recent.push(i); if(S.recent.length>24) S.recent.shift(); return i;
}

function todayStrip(){return S.today?`<div class="today"><b>Today:</b> ${S.today.text}<div class="deltas" style="margin:6px 0 0">${chipsFor(S.today.fx)}</div></div>`:""}

function renderEvent(){
  const ev=EVENTS[S.ev];
  app.innerHTML=hud()+todayStrip()+`<article class="card fade">${BAND}<div class="pad">
    <div class="emoji" aria-hidden="true">${ev.e}</div><p class="prompt">${ev.t}</p>
    <div class="choices">${ev.c.map((c,i)=>`<button class="choice" data-i="${i}">${c[0]}</button>`).join("")}</div></div></article>`;
  bindHud();
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const c=ev.c[+b.dataset.i];apply(c[1]);S.res={out:c[2],fx:c[1]};S.phase="eventResult";save();if(!checkDream())render()});
}

function renderEventResult(){
  const ev=EVENTS[S.ev];
  app.innerHTML=hud()+`<article class="card fade">${BAND}<div class="pad">
    <div class="emoji" aria-hidden="true">${ev.e}</div><p class="prompt" style="font-weight:500">${S.res.out}</p>
    <div class="deltas">${chipsFor(S.res.fx)}</div>
    <button class="btn" id="nx">${S.day===6?"Wrap up the week":"Next day"}</button></div></article>`;
  bindHud(); const nx=document.getElementById("nx"); nx.focus({preventScroll:true}); nx.onclick=endDay;
}

function endDay(){
  S.j=clamp(S.j-2); S.f=clamp(S.f-(has("pet")?1:2)); S.e=clamp(S.e+10); S.today=null;
  if(S.day===6){ enterSunday(); return }
  S.day++; S.phase="action"; save(); render();
}

function enterSunday(){
  const r=R(), a=AREAS[S.area];
  const rent=Math.round(a.rent*r.rentMul), living=60, house=r.houseFee||0;
  S.m-=rent+living+house; S.wk.spent+=rent+living+house;
  let od=0; if(S.m<0){od=25;S.m-=od;S.j=clamp(S.j-15);S.wk.spent+=od}
  S.bills={rent,living,house,od}; S.phase="sunday"; save(); render();
}

function mumLine(){
  const f=S.f;
  if(f>=80) return "“My pride! God will continue to bless you.”";
  if(f>=50) return "“You’re trying. But you can call more.”";
  if(f>=25) return "“Have you forgotten you have a mother?”";
  return "Mum has changed her WhatsApp picture to a sad Bible verse.";
}

function renderSunday(){
  const b=S.bills, D=DREAMS[S.dream], p=progress(), net=S.wk.earned-S.wk.spent;
  const canSave=S.dream!=="oga";
  const opts=[50,100,250,"All"];
  app.innerHTML=`<div class="topnav"><button class="ghost" id="rk">Rankings</button><button class="ghost" id="hm">Menu</button></div>
  <section class="card fade">${BAND}<div class="pad">
    <h2>Week ${S.week} done</h2>
    <p class="muted small">${S.streak>1?`🔥 ${S.streak}-day streak. Come back tomorrow for a bigger blessing.`:"Come back tomorrow for Mum’s daily blessing."}</p>
    <div class="ledger">
      <span>Earned and gifted</span><span>${gbp(S.wk.earned)}</span>
      <span>Spent this week</span><span>${gbp(-(S.wk.spent-b.rent-b.living-b.house-b.od))}</span>
      ${b.rent?`<span>Rent, ${AREAS[S.area].name}</span><span>${gbp(-b.rent)}</span>`:""}
      ${b.house?`<span>Contribution to Mum’s house</span><span>${gbp(-b.house)}</span>`:""}
      <span>Food and travel</span><span>${gbp(-b.living)}</span>
      ${b.od?`<span>Overdraft fee</span><span>${gbp(-b.od)}</span>`:""}
      <span class="tot">This week</span><span class="tot">${gbp(net)}</span>
      <span class="tot">In your account</span><span class="tot">${gbp(S.m)}</span>
    </div>
    <div class="mum"><b>Sunday call with Mum</b><br>${mumLine()}</div>
    <h3>${D.em} ${D.name}</h3>
    ${S.dream==="house"?`<div class="house">${houseStage(p)[0]}</div><p style="text-align:center" class="small">${houseStage(p)[1]}</p>`:""}
    <div class="bar" style="height:12px;margin-bottom:6px"><i style="width:${p*100}%;background:var(--indigo)"></i></div>
    <p class="small muted">${canSave?`${gbp(S.fund)} of ${gbp(D.target)} saved${S.dream==="mum"?`, Family ${S.f} of 80`:""}.`:`${title()}. Level ${lvl()} of 6.`}</p>
    ${canSave?`<div class="label">Move money to your dream fund</div><div class="saves">${opts.map(o=>{const amt=o==="All"?Math.max(0,S.m-100):o;return `<button data-s="${amt}" ${S.m<amt||amt<=0?"disabled":""}>${o==="All"?"All but £100":"£"+o}</button>`}).join("")}</div><p class="small muted">Money in the fund is safe from aunties.</p>`:""}
    <button class="btn" id="nw" style="margin-top:14px">Start week ${S.week+1}</button>
    <button class="btn alt" id="sh">Share my week</button>
  </div></section>`;
  bindHud();
  app.querySelectorAll("[data-s]").forEach(btn=>btn.onclick=()=>{const amt=+btn.dataset.s;if(amt<=0||S.m<amt)return;S.m-=amt;S.fund+=amt;save();toast(`${gbp(amt)} moved to your dream fund`);if(!checkDream())renderSunday()});
  document.getElementById("nw").onclick=newWeek;
  document.getElementById("sh").onclick=()=>share(`Week ${S.week} in Japa Life: ${R().em} ${title()} in ${AREAS[S.area].name}, ${Math.floor(p*100)}% to “${D.name}”. Mum says: ${mumLine().replace(/[“”]/g,"")}`);
}

function newWeek(){
  S.week++; S.day=0; S.shifts=0; S.wk={earned:0,spent:0}; S.phase="action";
  if(S.route==="student"&&S.week===13){ S.graduated=true; setTimeout(()=>toast("You graduated! 🎓 No more work limit."),300) }
  save(); syncRank(); render();
}

function renderDream(){
  const D=DREAMS[S.dream];
  app.innerHTML=`<section class="hero card fade">${BAND}<div class="pad" style="text-align:center">
    <div class="lottery-e pop">${D.em}</div>
    <h2 style="margin-top:12px">Dream achieved</h2>
    <p><b>${D.name}</b> in ${S.week} week${S.week>1?"s":""}.</p>
    <p class="muted">Mum has posted about you on three WhatsApp statuses. The village knows.</p>
    <button class="btn alt" id="sh">Share it</button>
    <h3 style="margin-top:20px;text-align:left">Choose your next dream</h3>
    ${Object.entries(DREAMS).filter(([k])=>k!==S.dream).map(([k,v])=>`<button class="pick" data-d="${k}" style="text-align:left"><b>${v.em} ${v.name}</b><span>${v.d}</span></button>`).join("")}
  </div></section>`;
  document.getElementById("sh").onclick=()=>share(`I achieved “${D.name}” ${D.em} in Japa Life as a ${R().name} in ${AREAS[S.area].name}! Week ${S.week}. Beat that.`);
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.dreamsDone=(S.dreamsDone||0)+1;S.dream=b.dataset.d;S.fund=0;view=null;save();syncRank();render()});
}

/* ---------- rankings ---------- */
async function renderRanks(){
  app.innerHTML=`<div class="topnav"><button class="ghost" id="bk">Back to game</button></div>
  <section class="card fade">${BAND}<div class="pad"><h2>Japa Rankings</h2>
  <div class="tabs"><button data-tab="players" class="${rankTab==="players"?"on":""}">Players</button><button data-tab="areas" class="${rankTab==="areas"?"on":""}">Area battle</button></div>
  <div id="rlist"><p class="muted">Loading…</p></div></div></section>`;
  document.getElementById("bk").onclick=()=>{view=null;render()};
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{rankTab=b.dataset.tab;renderRanks()});
  const el=document.getElementById("rlist");
  const db=await getDb(), me=await getId();
  if(!db){ el.innerHTML=`<p class="muted">Rankings aren’t available in this view. Your progress is still saved on this device.</p><p><b>Your score:</b> ${score()}</p>`; return }
  try{
    await syncRank();
    const snap=await db.collection("players").orderBy("score","desc").limit(200).get();
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!rows.length){ el.innerHTML=`<p class="muted">No one’s ranked yet. Finish a week to claim first place.</p>`; return }
    if(rankTab==="players"){
      el.innerHTML=rows.slice(0,50).map((r,i)=>`<div class="rank ${r.id===me?"me":""}"><span class="n">${i+1}</span>
        <div class="nm">${esc(r.name||"Someone")}${r.id===me?" (you)":""}<span>${(ROUTES[r.route]||{}).em||""} ${(AREAS[r.area]||{}).name||""}, ${(DREAMS[r.dream]||{}).em||""} ${r.progress||0}%${r.dreams?`, ${r.dreams} dream${r.dreams>1?"s":""} done`:""}</span></div>
        <span class="sc">${r.score||0}</span></div>`).join("");
    } else {
      const tot={}; Object.keys(AREAS).forEach(k=>tot[k]={s:0,n:0});
      rows.forEach(r=>{if(tot[r.area]){tot[r.area].s+=r.score||0;tot[r.area].n++}});
      const arr=Object.entries(tot).sort((a,b)=>b[1].s-a[1].s); const max=Math.max(1,arr[0][1].s);
      el.innerHTML=arr.map(([k,v],i)=>`<div class="area-bar"><div class="bar-k" style="font-size:15px;color:var(--ink)"><span><b>${i+1}. ${AREAS[k].name}</b>${k===S.area?" (you)":""}</span><span>${v.s} pts, ${v.n} player${v.n===1?"":"s"}</span></div><div class="bar"><i style="width:${v.s/max*100}%;background:${k===S.area?"var(--pink)":"var(--indigo)"}"></i></div></div>`).join("")+
        `<p class="small muted">Every player’s score counts for their area. Recruit your ends.</p>`;
    }
  }catch(e){ el.innerHTML=`<p class="muted">Couldn’t load rankings right now. Try again in a moment.</p>` }
}

/* ---------- share ---------- */
async function share(text){
  const url=location.href;
  try{ if(navigator.share){ await navigator.share({text,url}); return } }catch(e){ if(e&&e.name==="AbortError") return }
  try{ await navigator.clipboard.writeText(text+" "+url); toast("Copied. Paste it in the group chat.") }catch(e){ toast("Couldn’t copy. Screenshot it instead.") }
}

/* ---------- boot ---------- */
render();
</script>
</body>
